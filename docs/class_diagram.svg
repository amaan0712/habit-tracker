<svg viewBox="0 0 960 720" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, Menlo, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="triangle" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto">
      <path d="M0,0 L14,6 L0,12 Z" fill="white" stroke="black" stroke-width="1"/>
    </marker>
    <marker id="diamond" markerWidth="16" markerHeight="10" refX="15" refY="5" orient="auto">
      <path d="M0,5 L8,0 L16,5 L8,10 Z" fill="white" stroke="black" stroke-width="1"/>
    </marker>
  </defs>

  <style>
    .box { fill: white; stroke: #333; stroke-width: 1.5; }
    .header { font-weight: bold; font-size: 15px; }
    .abstractHeader { font-weight: bold; font-style: italic; font-size: 15px; }
    .field { font-size: 12px; }
    .sep { stroke: #333; stroke-width: 1; }
    .label { font-size: 12px; fill: #333; }
    .rel { stroke: #333; stroke-width: 1.5; fill: none; }
  </style>

  <text x="480" y="26" text-anchor="middle" font-size="18" font-weight="bold">Habit Tracker &#8212; Class Diagram (Domain Model)</text>

  <!-- User -->
  <rect class="box" x="20" y="280" width="200" height="150"/>
  <text class="header" x="120" y="300" text-anchor="middle">User</text>
  <line class="sep" x1="20" y1="310" x2="220" y2="310"/>
  <text class="field" x="30" y="328">- id: int</text>
  <text class="field" x="30" y="346">- username: String</text>
  <text class="field" x="30" y="364">- habits: List&lt;Habit&gt;</text>
  <line class="sep" x1="20" y1="374" x2="220" y2="374"/>
  <text class="field" x="30" y="392">+ addHabit(h): void</text>
  <text class="field" x="30" y="410">+ getHabits(): List&lt;Habit&gt;</text>

  <!-- Habit (abstract) -->
  <rect class="box" x="370" y="55" width="240" height="225"/>
  <text class="abstractHeader" x="490" y="78" text-anchor="middle">&#171;abstract&#187; Habit</text>
  <line class="sep" x1="370" y1="88" x2="610" y2="88"/>
  <text class="field" x="380" y="106">- id: int</text>
  <text class="field" x="380" y="124">- userId: int</text>
  <text class="field" x="380" y="142">- name: String</text>
  <text class="field" x="380" y="160">- frequency: Frequency</text>
  <text class="field" x="380" y="178">- createdDate: LocalDate</text>
  <text class="field" x="380" y="196">- logEntries: List&lt;LogEntry&gt;</text>
  <line class="sep" x1="370" y1="206" x2="610" y2="206"/>
  <text class="field" x="380" y="224" font-style="italic">+ isCompletedOn(e): boolean</text>
  <text class="field" x="380" y="242" font-style="italic">+ getCompletionCriteria(): String</text>
  <text class="field" x="380" y="260">+ addLogEntry(e): void</text>

  <!-- LogEntry -->
  <rect class="box" x="740" y="280" width="200" height="150"/>
  <text class="header" x="840" y="300" text-anchor="middle">LogEntry</text>
  <line class="sep" x1="740" y1="310" x2="940" y2="310"/>
  <text class="field" x="750" y="328">- id: int</text>
  <text class="field" x="750" y="346">- habitId: int</text>
  <text class="field" x="750" y="364">- logDate: LocalDate</text>
  <text class="field" x="750" y="382">- value: double</text>

  <!-- BooleanHabit -->
  <rect class="box" x="60" y="540" width="200" height="120"/>
  <text class="header" x="160" y="560" text-anchor="middle">BooleanHabit</text>
  <line class="sep" x1="60" y1="570" x2="260" y2="570"/>
  <text class="field" x="70" y="588">(value &#8805; 1.0 = done)</text>
  <line class="sep" x1="60" y1="598" x2="260" y2="598"/>
  <text class="field" x="70" y="616">+ isCompletedOn(e)</text>
  <text class="field" x="70" y="634">+ getCompletionCriteria()</text>

  <!-- CountableHabit -->
  <rect class="box" x="380" y="540" width="220" height="140"/>
  <text class="header" x="490" y="560" text-anchor="middle">CountableHabit</text>
  <line class="sep" x1="380" y1="570" x2="600" y2="570"/>
  <text class="field" x="390" y="588">- targetCount: int</text>
  <line class="sep" x1="380" y1="598" x2="600" y2="598"/>
  <text class="field" x="390" y="616">+ isCompletedOn(e)</text>
  <text class="field" x="390" y="634">+ getCompletionCriteria()</text>
  <text class="field" x="390" y="652">+ getTargetCount(): int</text>

  <!-- TimedHabit -->
  <rect class="box" x="700" y="540" width="220" height="140"/>
  <text class="header" x="810" y="560" text-anchor="middle">TimedHabit</text>
  <line class="sep" x1="700" y1="570" x2="920" y2="570"/>
  <text class="field" x="710" y="588">- targetMinutes: int</text>
  <line class="sep" x1="700" y1="598" x2="920" y2="598"/>
  <text class="field" x="710" y="616">+ isCompletedOn(e)</text>
  <text class="field" x="710" y="634">+ getCompletionCriteria()</text>
  <text class="field" x="710" y="652">+ getTargetMinutes(): int</text>

  <!-- Inheritance arrows (hollow triangle points to Habit), routed clear of other boxes -->
  <path class="rel" d="M160,540 L160,500 L340,500 L340,300 L370,270" marker-end="url(#triangle)"/>
  <path class="rel" d="M490,540 L490,300" marker-end="url(#triangle)"/>
  <path class="rel" d="M810,540 L810,500 L640,500 L640,300 L610,270" marker-end="url(#triangle)"/>

  <!-- Aggregation: User -> Habit -->
  <path class="rel" d="M220,320 L370,170" marker-start="url(#diamond)"/>
  <text class="label" x="230" y="315">1</text>
  <text class="label" x="345" y="180">*</text>

  <!-- Aggregation: Habit -> LogEntry -->
  <path class="rel" d="M610,170 L740,320" marker-start="url(#diamond)"/>
  <text class="label" x="620" y="180">1</text>
  <text class="label" x="715" y="315">*</text>
</svg>
