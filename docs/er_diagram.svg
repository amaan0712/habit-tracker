<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, Menlo, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="one" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <line x1="6" y1="0" x2="6" y2="12" stroke="#333" stroke-width="1.5"/>
    </marker>
  </defs>
  <style>
    .tbl { fill: white; stroke: #333; stroke-width: 1.5; }
    .tblHeader { fill: #dde6f5; stroke: #333; stroke-width: 1.5; }
    .header { font-weight: bold; font-size: 14px; }
    .col { font-size: 12px; }
    .pk { font-weight: bold; }
    .sep { stroke: #333; stroke-width: 1; }
    .rel { stroke: #333; stroke-width: 1.5; fill: none; }
    .label { font-size: 12px; }
  </style>

  <text x="450" y="24" text-anchor="middle" font-size="18" font-weight="bold">ER Diagram &#8212; Habit Tracker Database</text>

  <!-- users table -->
  <rect class="tblHeader" x="30" y="150" width="180" height="30"/>
  <text class="header" x="120" y="170" text-anchor="middle">users</text>
  <rect class="tbl" x="30" y="180" width="180" height="80"/>
  <text class="col pk" x="40" y="200">PK  id : INTEGER</text>
  <text class="col" x="40" y="220">username : TEXT (UNIQUE)</text>

  <!-- habits table -->
  <rect class="tblHeader" x="360" y="60" width="220" height="30"/>
  <text class="header" x="470" y="80" text-anchor="middle">habits</text>
  <rect class="tbl" x="360" y="90" width="220" height="220"/>
  <text class="col pk" x="370" y="110">PK  id : INTEGER</text>
  <text class="col" x="370" y="130">FK  user_id : INTEGER</text>
  <text class="col" x="370" y="150">name : TEXT</text>
  <text class="col" x="370" y="170">type : TEXT</text>
  <text class="col" x="370" y="190">(BOOLEAN/COUNTABLE/TIMED)</text>
  <text class="col" x="370" y="210">frequency : TEXT</text>
  <text class="col" x="370" y="230">(DAILY/WEEKLY)</text>
  <text class="col" x="370" y="250">target_value : INTEGER (nullable)</text>
  <text class="col" x="370" y="270">created_date : TEXT (ISO date)</text>

  <!-- habit_logs table -->
  <rect class="tblHeader" x="690" y="150" width="200" height="30"/>
  <text class="header" x="790" y="170" text-anchor="middle">habit_logs</text>
  <rect class="tbl" x="690" y="180" width="200" height="100"/>
  <text class="col pk" x="700" y="200">PK  id : INTEGER</text>
  <text class="col" x="700" y="220">FK  habit_id : INTEGER</text>
  <text class="col" x="700" y="240">log_date : TEXT (ISO date)</text>
  <text class="col" x="700" y="260">value : REAL</text>
  <text class="col" x="700" y="278" font-size="10">UNIQUE(habit_id, log_date)</text>

  <!-- Relationships -->
  <path class="rel" d="M210,190 L360,170"/>
  <text class="label" x="220" y="180">1</text>
  <text class="label" x="345" y="165">*</text>
  <text class="label" x="240" y="150">user has habits</text>

  <path class="rel" d="M580,200 L690,220"/>
  <text class="label" x="590" y="195">1</text>
  <text class="label" x="670" y="215">*</text>
  <text class="label" x="595" y="235">habit has logs</text>
</svg>
