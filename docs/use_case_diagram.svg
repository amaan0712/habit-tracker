<svg viewBox="0 0 820 640" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, Menlo, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .oval { fill: white; stroke: #333; stroke-width: 1.5; }
    .actor-label { font-size: 13px; font-weight: bold; }
    .usecase-label { font-size: 13px; }
    .rel { stroke: #333; stroke-width: 1.3; fill: none; }
    .boundary { fill: none; stroke: #888; stroke-width: 1; stroke-dasharray: 5,4; }
  </style>

  <text x="410" y="26" text-anchor="middle" font-size="18" font-weight="bold">Use Case Diagram &#8212; Habit Tracker</text>

  <!-- System boundary -->
  <rect class="boundary" x="230" y="65" width="420" height="500"/>
  <text x="440" y="85" text-anchor="middle" font-size="13" fill="#666">Habit Tracker System</text>

  <!-- Actor: User (stick figure) -->
  <g transform="translate(90,290)">
    <circle cx="0" cy="0" r="14" fill="white" stroke="#333" stroke-width="1.5"/>
    <line x1="0" y1="14" x2="0" y2="55" stroke="#333" stroke-width="1.5"/>
    <line x1="-20" y1="30" x2="20" y2="30" stroke="#333" stroke-width="1.5"/>
    <line x1="0" y1="55" x2="-18" y2="90" stroke="#333" stroke-width="1.5"/>
    <line x1="0" y1="55" x2="18" y2="90" stroke="#333" stroke-width="1.5"/>
    <text class="actor-label" x="0" y="112" text-anchor="middle">User</text>
  </g>

  <!-- Actor: Reminder Thread -->
  <g transform="translate(730,470)">
    <circle cx="0" cy="0" r="14" fill="white" stroke="#333" stroke-width="1.5"/>
    <line x1="0" y1="14" x2="0" y2="55" stroke="#333" stroke-width="1.5"/>
    <line x1="-20" y1="30" x2="20" y2="30" stroke="#333" stroke-width="1.5"/>
    <line x1="0" y1="55" x2="-18" y2="90" stroke="#333" stroke-width="1.5"/>
    <line x1="0" y1="55" x2="18" y2="90" stroke="#333" stroke-width="1.5"/>
    <text class="actor-label" x="0" y="112" text-anchor="middle">Reminder</text>
    <text class="actor-label" x="0" y="128" text-anchor="middle">Thread</text>
  </g>

  <!-- Use cases, evenly spaced -->
  <ellipse class="oval" cx="440" cy="105" rx="110" ry="32"/>
  <text class="usecase-label" x="440" y="110" text-anchor="middle">Create a Habit</text>

  <ellipse class="oval" cx="440" cy="185" rx="110" ry="32"/>
  <text class="usecase-label" x="440" y="190" text-anchor="middle">Log a Habit Entry</text>

  <ellipse class="oval" cx="440" cy="265" rx="120" ry="32"/>
  <text class="usecase-label" x="440" y="270" text-anchor="middle">View Habits &amp; Streaks</text>

  <ellipse class="oval" cx="440" cy="345" rx="110" ry="32"/>
  <text class="usecase-label" x="440" y="350" text-anchor="middle">View Leaderboard</text>

  <ellipse class="oval" cx="440" cy="425" rx="120" ry="32"/>
  <text class="usecase-label" x="440" y="430" text-anchor="middle">Export CSV Report</text>

  <ellipse class="oval" cx="510" cy="520" rx="130" ry="32"/>
  <text class="usecase-label" x="510" y="525" text-anchor="middle">Check &amp; Notify Incomplete Habits</text>

  <!-- User associations, each starting at a distinct point around the actor -->
  <line class="rel" x1="120" y1="295" x2="330" y2="105"/>
  <line class="rel" x1="120" y1="305" x2="330" y2="185"/>
  <line class="rel" x1="120" y1="315" x2="320" y2="265"/>
  <line class="rel" x1="120" y1="325" x2="330" y2="345"/>
  <line class="rel" x1="120" y1="335" x2="320" y2="425"/>

  <!-- Reminder thread association -->
  <line class="rel" x1="710" y1="490" x2="610" y2="520"/>
</svg>
