<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, Menlo, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrowA" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
  <style>
    .layer { fill: #f5f7fb; stroke: #333; stroke-width: 1.5; }
    .box { fill: white; stroke: #333; stroke-width: 1.3; }
    .layerLabel { font-size: 12px; fill: #555; font-weight: bold; }
    .boxLabel { font-size: 13px; }
    .rel { stroke: #333; stroke-width: 1.4; fill: none; marker-end: url(#arrowA); }
    .relDashed { stroke: #666; stroke-width: 1.2; fill: none; stroke-dasharray: 5,3; marker-end: url(#arrowA); }
  </style>

  <text x="450" y="24" text-anchor="middle" font-size="18" font-weight="bold">System Architecture &#8212; Habit Tracker</text>

  <!-- CLI Layer -->
  <rect class="layer" x="40" y="55" width="820" height="70"/>
  <text class="layerLabel" x="50" y="72">Presentation Layer</text>
  <rect class="box" x="360" y="80" width="180" height="35"/>
  <text class="boxLabel" x="450" y="102" text-anchor="middle">Main (CLI menu loop)</text>

  <!-- Service Layer -->
  <rect class="layer" x="40" y="145" width="820" height="100"/>
  <text class="layerLabel" x="50" y="162">Service Layer (business logic)</text>
  <rect class="box" x="180" y="175" width="200" height="50"/>
  <text class="boxLabel" x="280" y="195" text-anchor="middle">HabitService</text>
  <text class="boxLabel" x="280" y="212" text-anchor="middle" font-size="10">(validation, exceptions)</text>

  <rect class="box" x="520" y="175" width="200" height="50"/>
  <text class="boxLabel" x="620" y="195" text-anchor="middle">LeaderboardService</text>
  <text class="boxLabel" x="620" y="212" text-anchor="middle" font-size="10">(Stream-based ranking)</text>

  <!-- Streak + IO + Concurrency Layer -->
  <rect class="layer" x="40" y="265" width="820" height="100"/>
  <text class="layerLabel" x="50" y="282">Support Layer</text>
  <rect class="box" x="70" y="295" width="220" height="50"/>
  <text class="boxLabel" x="180" y="315" text-anchor="middle">StreakCalculator</text>
  <text class="boxLabel" x="180" y="332" text-anchor="middle" font-size="10">(strategy: Daily / Weekly)</text>

  <rect class="box" x="340" y="295" width="220" height="50"/>
  <text class="boxLabel" x="450" y="315" text-anchor="middle">ReportExporter</text>
  <text class="boxLabel" x="450" y="332" text-anchor="middle" font-size="10">(NIO.2 CSV export)</text>

  <rect class="box" x="610" y="295" width="220" height="50"/>
  <text class="boxLabel" x="720" y="315" text-anchor="middle">ReminderScheduler</text>
  <text class="boxLabel" x="720" y="332" text-anchor="middle" font-size="10">(background daemon thread)</text>

  <!-- DAO Layer -->
  <rect class="layer" x="40" y="385" width="820" height="100"/>
  <text class="layerLabel" x="50" y="402">Data Access Layer (JDBC)</text>
  <rect class="box" x="110" y="415" width="180" height="50"/>
  <text class="boxLabel" x="200" y="440" text-anchor="middle">UserDao</text>

  <rect class="box" x="360" y="415" width="180" height="50"/>
  <text class="boxLabel" x="450" y="440" text-anchor="middle">HabitDao</text>

  <rect class="box" x="610" y="415" width="180" height="50"/>
  <text class="boxLabel" x="700" y="440" text-anchor="middle">HabitLogDao</text>

  <!-- DB Layer -->
  <rect class="layer" x="40" y="505" width="820" height="80"/>
  <text class="layerLabel" x="50" y="522">Persistence</text>
  <rect class="box" x="360" y="535" width="180" height="35"/>
  <text class="boxLabel" x="450" y="557" text-anchor="middle">SQLite (habits.db)</text>

  <!-- Arrows: layer to layer -->
  <path class="rel" d="M450,115 L450,145"/>
  <path class="rel" d="M280,225 L200,265"/>
  <path class="rel" d="M280,225 L450,265"/>
  <path class="rel" d="M620,225 L720,265"/>
  <path class="rel" d="M180,345 L200,385"/>
  <path class="rel" d="M450,345 L450,385"/>
  <path class="rel" d="M720,345 L700,385"/>
  <path class="rel" d="M200,465 L400,505"/>
  <path class="rel" d="M450,465 L450,505"/>
  <path class="rel" d="M700,465 L500,505"/>

  <!-- Reminder thread reads DAOs directly (independent of Service layer for its own loop) -->
  <path class="relDashed" d="M720,345 L450,385"/>
</svg>
