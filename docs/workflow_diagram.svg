<svg viewBox="0 0 980 800" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, Menlo, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrowB" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
  <style>
    .startEnd { fill: #eef; stroke: #333; stroke-width: 1.5; }
    .proc { fill: white; stroke: #333; stroke-width: 1.4; }
    .decision { fill: #fef8e3; stroke: #333; stroke-width: 1.4; }
    .flow { stroke: #333; stroke-width: 1.4; fill: none; marker-end: url(#arrowB); }
    .flowPlain { stroke: #333; stroke-width: 1.4; fill: none; }
    .lbl { font-size: 12px; }
    .lblSmall { font-size: 10px; }
  </style>

  <text x="490" y="26" text-anchor="middle" font-size="18" font-weight="bold">Process Flow &#8212; Application Workflow</text>

  <!-- Start -->
  <ellipse class="startEnd" cx="490" cy="55" rx="70" ry="22"/>
  <text class="lbl" x="490" y="60" text-anchor="middle">Start</text>

  <!-- Connect DB -->
  <rect class="proc" x="400" y="95" width="180" height="38"/>
  <text class="lbl" x="490" y="112" text-anchor="middle">Connect to DB &amp;</text>
  <text class="lblSmall" x="490" y="126" text-anchor="middle">create schema if needed</text>

  <!-- Start reminder thread -->
  <rect class="proc" x="400" y="150" width="180" height="38"/>
  <text class="lbl" x="490" y="167" text-anchor="middle">Start reminder</text>
  <text class="lblSmall" x="490" y="181" text-anchor="middle">background thread</text>

  <!-- Login/create user -->
  <rect class="proc" x="400" y="205" width="180" height="38"/>
  <text class="lbl" x="490" y="228" text-anchor="middle">Login or create user</text>

  <!-- Show menu (loop entry point) -->
  <rect class="proc" x="400" y="260" width="180" height="38"/>
  <text class="lbl" x="490" y="283" text-anchor="middle">Show menu</text>

  <!-- Decision -->
  <polygon class="decision" points="490,318 610,373 490,428 370,373"/>
  <text class="lbl" x="490" y="368" text-anchor="middle">User</text>
  <text class="lbl" x="490" y="384" text-anchor="middle">choice?</text>

  <!-- Branch boxes: a clean row, evenly spaced -->
  <rect class="proc" x="30" y="470" width="140" height="55"/>
  <text class="lbl" x="100" y="493" text-anchor="middle">Create Habit</text>
  <text class="lblSmall" x="100" y="509" text-anchor="middle">(validate + persist)</text>

  <rect class="proc" x="195" y="470" width="140" height="55"/>
  <text class="lbl" x="265" y="493" text-anchor="middle">Log Entry</text>
  <text class="lblSmall" x="265" y="509" text-anchor="middle">(dup check + persist)</text>

  <rect class="proc" x="360" y="470" width="140" height="55"/>
  <text class="lbl" x="430" y="493" text-anchor="middle">View Streaks</text>
  <text class="lblSmall" x="430" y="509" text-anchor="middle">(Stream calc)</text>

  <rect class="proc" x="525" y="470" width="140" height="55"/>
  <text class="lbl" x="595" y="493" text-anchor="middle">View Leaderboard</text>
  <text class="lblSmall" x="595" y="509" text-anchor="middle">(rank all users)</text>

  <rect class="proc" x="690" y="470" width="140" height="55"/>
  <text class="lbl" x="760" y="493" text-anchor="middle">Export Report</text>
  <text class="lblSmall" x="760" y="509" text-anchor="middle">(NIO.2 CSV write)</text>

  <rect class="proc" x="855" y="470" width="100" height="55"/>
  <text class="lbl" x="905" y="502" text-anchor="middle">Exit</text>

  <!-- Decision fans out to the 6 branch box tops -->
  <path class="flow" d="M430,405 L100,470"/>
  <path class="flow" d="M455,418 L265,470"/>
  <path class="flow" d="M480,427 L430,470"/>
  <path class="flow" d="M500,427 L595,470"/>
  <path class="flow" d="M525,418 L760,470"/>
  <path class="flow" d="M550,405 L905,470"/>

  <!-- Return "bus": each of the 5 non-exit boxes sends a stub down to a shared
       horizontal collector line, which merges into one vertical line back up
       to the left of Show Menu. This avoids the tangle of 5 separate curved
       arrows crossing each other. -->
  <line class="flowPlain" x1="100" y1="525" x2="100" y2="565"/>
  <line class="flowPlain" x1="265" y1="525" x2="265" y2="565"/>
  <line class="flowPlain" x1="430" y1="525" x2="430" y2="565"/>
  <line class="flowPlain" x1="595" y1="525" x2="595" y2="565"/>
  <line class="flowPlain" x1="760" y1="525" x2="760" y2="565"/>
  <!-- collector line joining all 5 stubs -->
  <line class="flowPlain" x1="100" y1="565" x2="760" y2="565"/>
  <!-- single trunk back up to just left of Show Menu, then arrow into it -->
  <line class="flowPlain" x1="100" y1="565" x2="100" y2="615"/>
  <line class="flowPlain" x1="100" y1="615" x2="330" y2="615"/>
  <path class="flow" d="M330,615 L330,279 L400,279"/>
  <text class="lblSmall" x="105" y="610">loop back to menu after each action</text>

  <!-- Exit path -->
  <rect class="proc" x="835" y="620" width="140" height="50"/>
  <text class="lbl" x="905" y="640" text-anchor="middle">Stop reminder thread,</text>
  <text class="lblSmall" x="905" y="656" text-anchor="middle">close DB connection</text>
  <path class="flow" d="M905,525 L905,620"/>

  <!-- End -->
  <ellipse class="startEnd" cx="905" cy="735" rx="70" ry="24"/>
  <text class="lbl" x="905" y="740" text-anchor="middle">End</text>
  <path class="flow" d="M905,670 L905,711"/>

  <!-- Main vertical flow (start through decision) -->
  <path class="flow" d="M490,77 L490,95"/>
  <path class="flow" d="M490,133 L490,150"/>
  <path class="flow" d="M490,188 L490,205"/>
  <path class="flow" d="M490,243 L490,260"/>
  <path class="flow" d="M490,298 L490,318"/>
</svg>
