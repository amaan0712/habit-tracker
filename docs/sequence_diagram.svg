<svg viewBox="0 0 960 800" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, Menlo, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
  <style>
    .actorBox { fill: #eef; stroke: #333; stroke-width: 1.2; }
    .lifeline { stroke: #888; stroke-width: 1; stroke-dasharray: 4,3; }
    .msg { stroke: #333; stroke-width: 1.3; fill: none; marker-end: url(#arrow); }
    .msgDashed { stroke: #333; stroke-width: 1.3; fill: none; stroke-dasharray: 5,3; marker-end: url(#arrow); }
    .label { font-size: 11.5px; }
    .frame { fill: none; stroke: #333; stroke-width: 1; }
    .frameLabel { font-size: 11px; font-weight: bold; }
  </style>

  <text x="480" y="26" text-anchor="middle" font-size="18" font-weight="bold">Sequence Diagram &#8212; Logging a Habit Entry</text>

  <!-- Participant headers -->
  <g>
    <rect class="actorBox" x="35" y="50" width="110" height="34"/>
    <text class="label" x="90" y="71" text-anchor="middle">User</text>

    <rect class="actorBox" x="220" y="50" width="130" height="34"/>
    <text class="label" x="285" y="71" text-anchor="middle">Main (CLI)</text>

    <rect class="actorBox" x="425" y="50" width="140" height="34"/>
    <text class="label" x="495" y="71" text-anchor="middle">HabitService</text>

    <rect class="actorBox" x="640" y="50" width="140" height="34"/>
    <text class="label" x="710" y="71" text-anchor="middle">HabitLogDao</text>

    <rect class="actorBox" x="850" y="50" width="100" height="34"/>
    <text class="label" x="900" y="71" text-anchor="middle">SQLite DB</text>
  </g>

  <!-- Lifelines -->
  <line class="lifeline" x1="90" y1="84" x2="90" y2="770"/>
  <line class="lifeline" x1="285" y1="84" x2="285" y2="770"/>
  <line class="lifeline" x1="495" y1="84" x2="495" y2="770"/>
  <line class="lifeline" x1="710" y1="84" x2="710" y2="770"/>
  <line class="lifeline" x1="900" y1="84" x2="900" y2="770"/>

  <!-- Setup messages -->
  <path class="msg" d="M90,115 L285,115"/>
  <text class="label" x="95" y="110">selects "Log entry", enters habitId/date/value</text>

  <path class="msg" d="M285,155 L495,155"/>
  <text class="label" x="290" y="150">logEntry(habitId, date, value)</text>

  <path class="msg" d="M495,195 L710,195"/>
  <text class="label" x="500" y="190">existsForDate(habitId, date)</text>

  <path class="msg" d="M710,230 L900,230"/>
  <text class="label" x="715" y="225" font-size="10.5">SELECT by habit_id + log_date</text>

  <path class="msgDashed" d="M900,260 L710,260"/>
  <text class="label" x="720" y="255">result set</text>

  <path class="msgDashed" d="M710,290 L495,290"/>
  <text class="label" x="505" y="285">false (no existing entry)</text>

  <!-- Alt frame -->
  <rect class="frame" x="65" y="320" width="860" height="240"/>
  <text class="frameLabel" x="75" y="336">alt</text>
  <text class="label" x="110" y="336">[no existing entry for that date]</text>
  <line class="frame" x1="65" y1="440" x2="925" y2="440" stroke-dasharray="4,3"/>
  <text class="frameLabel" x="75" y="456">[else: entry already exists]</text>

  <!-- happy path inside alt -->
  <path class="msg" d="M495,365 L710,365"/>
  <text class="label" x="500" y="360">save(new LogEntry(habitId, date, value))</text>

  <path class="msg" d="M710,395 L900,395"/>
  <text class="label" x="715" y="390">INSERT INTO habit_logs ...</text>

  <path class="msgDashed" d="M900,420 L710,420"/>
  <text class="label" x="720" y="416" font-size="10">generated id</text>

  <!-- exception path inside alt -->
  <path class="msgDashed" d="M495,480 L285,480"/>
  <text class="label" x="300" y="475">throws DuplicateLogEntryException</text>

  <path class="msg" d="M285,510 L90,510"/>
  <text class="label" x="95" y="505">prints "Error: already logged for this date"</text>

  <!-- return after alt (happy path continues) -->
  <path class="msgDashed" d="M495,600 L285,600"/>
  <text class="label" x="300" y="595">returns saved LogEntry</text>

  <path class="msg" d="M285,635 L90,635"/>
  <text class="label" x="95" y="630">prints "Logged: 2026-09-08 -&gt; 1.0"</text>
</svg>
